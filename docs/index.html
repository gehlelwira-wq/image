<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>image · gehlelwira-wq</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, #1f6feb33, transparent 45%),
        radial-gradient(circle at 85% 90%, #23863633, transparent 45%),
        var(--bg);
    }
    main { width: min(920px, 100%); }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      letter-spacing: -.03em;
    }
    .sub {
      margin: 14px 0 28px;
      max-width: 60ch;
      color: var(--muted);
      line-height: 1.7;
    }
    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 70px #0008;
    }
    .card img { display: block; width: 100%; height: auto; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
    nav a {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: 14px;
      text-decoration: none;
      background: #161b22aa;
    }
    nav a:hover { border-color: var(--accent); color: var(--accent); }
    footer {
      margin-top: 30px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GitHub Pages</p>
    <h1>image</h1>
    <p class="sub">
      一个用于测试 GitHub 图片托管、GitHub Actions 与 SSH push/pull 工作流的仓库。
      下面这张 SVG 由 DSH 推送，并由 GitHub Actions 自动校验。
    </p>
    <section class="card">
      <img src="./hello-dsh.svg" alt="Hello GitHub from DSH">
    </section>
    <nav>
      <a href="https://github.com/gehlelwira-wq/image">仓库</a>
      <a href="https://github.com/gehlelwira-wq/image/actions">Actions</a>
      <a href="https://github.com/gehlelwira-wq/image/blob/main/README.md">README</a>
      <a href="https://github.com/gehlelwira-wq/image/tree/main/images">images/</a>
    </nav>
  </main>
  <footer>Hosted on GitHub Pages · gehlelwira-wq/image</footer>
</body>
</html>
